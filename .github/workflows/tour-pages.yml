name: Deploy demo tour to GitHub Pages

# Static build of packages/web/tour (demo tour with anonymized data, no backend).
# Requires Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - '.github/workflows/tour-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build tour
        run: npm run build:tour -w packages/web
        env:
          TOUR_BASE: /visualizer-lite/

      - name: SPA fallback for deep links
        run: cp packages/web/dist-tour/index.html packages/web/dist-tour/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist-tour

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
